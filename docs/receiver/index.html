<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flac Cast Receiver</title>
  <style>
    html, body, cast-media-player {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #0d100e;
    }

    cast-media-player {
      --theme-hue: 82;
      --splash-image: none;
      --logo-image: none;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    "use strict";

    const context = cast.framework.CastReceiverContext.getInstance();
    const Command = cast.framework.messages.Command;
    const supportedCommands = Command.ALL_BASIC_MEDIA
      | Command.QUEUE_NEXT
      | Command.QUEUE_PREV
      | Command.QUEUE_SHUFFLE
      | Command.QUEUE_REPEAT;

    context.start({
      enforceSupportedCommands: true,
      statusText: "Flac Cast",
      supportedCommands
    });
  </script>
</body>
</html>
