name: Feature request
description: Suggest an improvement for Flac Cast
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user need before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Potential impact
      options:
        - label: This may add network access or data collection.
        - label: This may add a dependency or external service.
        - label: This may change file deletion, packaging, or signing behavior.
