name: Bug report
description: Report reproducible incorrect behavior in Flac Cast
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include music files, credentials, private NAS paths, IP addresses, or security vulnerabilities. Use the Security tab for private vulnerability reports.
  - type: input
    id: version
    attributes:
      label: Flac Cast version
      placeholder: 1.0.1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS Apple silicon
        - Linux x64
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove personal and network-identifying information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a private security report.
          required: true
